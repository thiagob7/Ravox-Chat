# Empacota o aplicativo de desktop e anexa os instaladores à release da tag.
#
# Existe por um motivo só: o instalador de Windows (nsis) NÃO sai de um Mac.
# Aqui o mesmo commit é empacotado em cada sistema, na máquina certa.
#
# Dispara ao publicar uma tag `v*` — ou na mão, pela aba Actions.
name: Aplicativo de desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release que vai receber os arquivos (ex.: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  empacotar:
    strategy:
      # `fail-fast: false` de propósito: se o build do Windows quebrar, ainda
      # queremos o do macOS publicado, em vez de perder os dois.
      fail-fast: false
      matrix:
        include:
          - so: macos-14
            nome: macOS
            arquivos: "apps/desktop/release/*.dmg"
          - so: windows-latest
            nome: Windows
            arquivos: "apps/desktop/release/*.exe"

    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.so }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # A tag e a versao do package.json TEM que bater.
      #
      # O app compara `app.getVersion()` — que sai do package.json no build —
      # com a tag da release. Empacotar a 0.2.1 e anexar na v0.2.2 cria um laco:
      # o app instala, reabre reportando 0.2.1, ve a v0.2.2 de novo e oferece a
      # atualizacao para sempre. Falhar aqui e barato; descobrir depois de
      # publicado significa todo mundo em laco ate a proxima release.
      - name: Conferir a versao
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSAO=$(node -p "require('./apps/desktop/package.json').version")

          if [ "${TAG#v}" != "$VERSAO" ]; then
            echo "::error::A tag $TAG nao bate com a versao $VERSAO do apps/desktop/package.json."
            echo "::error::Suba a versao no package.json antes de publicar, senao o app instalado fica em laco de atualizacao."
            exit 1
          fi

          echo "tag $TAG = versao $VERSAO"

      - name: Empacotar
        env:
          # É embutida no bundle durante o build (tsup), não lida em execução:
          # sem ela o app instalado procuraria um localhost que não existe na
          # máquina de quem baixou.
          GRAVAE_APP_URL: ${{ vars.GRAVAE_APP_URL || 'https://app-ravox-chat.vercel.app' }}
        run: yarn workspace @gravae/desktop empacotar

      # Ponte para quem ainda está na v0.2.5 ou antes. O atualizador dessas
      # versões só procura `gravae-chat-mac.dmg` / `gravae-chat-win.exe` na
      # release, e no Mac ainda quer achar um `Gravae Chat.app` dentro do .dmg.
      # Sem estas cópias, elas nunca veem a versão nova. O conteúdo é o mesmo
      # app; no Mac só a pasta do pacote muda de nome, e a próxima atualização
      # (já pelo atualizador novo) renomeia para `Ravox Chat.app`.
      - name: Ponte para o atualizador antigo (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/release
        run: |
          APP=$(find . -maxdepth 2 -name "Ravox Chat.app" -type d | head -n 1)
          test -n "$APP"

          mkdir ponte
          ditto "$APP" "ponte/Gravae Chat.app"
          ln -s /Applications ponte/Applications
          hdiutil create -volname "Ravox Chat" -srcfolder ponte -ov -format UDZO gravae-chat-mac.dmg
          rm -rf ponte

      - name: Ponte para o atualizador antigo (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/release
        shell: bash
        run: cp ravox-chat-win.exe gravae-chat-win.exe

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        # `--clobber` porque rodar de novo tem que substituir o arquivo, não falhar.
        #
        # A release e criada quando nao existe. Disparo pela mao (`workflow_dispatch`)
        # nao cria nada sozinho — e o `upload` recusava com "release not found",
        # depois de ja ter empacotado os dois sistemas. Falhar no fim, quando o
        # trabalho todo ja foi feito, e o pior lugar pra falhar.
        #
        # O `|| true` na criacao e por causa da matriz: macOS e Windows rodam ao
        # mesmo tempo, e os dois tentam criar. O segundo perde a corrida, e
        # perder essa corrida nao e erro — a release ja esta la, que era o
        # objetivo.
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Ravox Chat ${TAG#v}" --generate-notes \
            || true

          gh release upload "$TAG" ${{ matrix.arquivos }} --clobber
