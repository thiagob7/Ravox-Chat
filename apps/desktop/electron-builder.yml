# Empacotamento do aplicativo de desktop.
#
# O motivo de existir não é distribuição — é IDENTIDADE. Em desenvolvimento o
# executável é o Electron genérico, e o macOS guarda as permissões debaixo de
# quem lançou o processo. Resultado: microfone e gravação de tela ficavam
# negados sem o app sequer aparecer nas listas de Privacidade. Empacotado, ele
# vira "Ravox Chat" com identificador próprio, pede as permissões sozinho e
# aparece na lista com o nome dele.
appId: io.gravae.chat

# ⚠️ SEM ACENTO AQUI, de propósito. O `productName` batiza o executável e os
# quatro processos auxiliares ("… Helper.app", "… Helper (GPU).app", …). Com
# acento no nome, o app empacotado MORRE em SIGTRAP no processo principal,
# antes do `app.whenReady()` — sem janela, sem uma linha de erro. O mesmo
# bundle com nome ASCII abre normalmente.
productName: Ravox Chat
copyright: Ravox Chat

# O uiohook-napi é N-API e já vem com o `.node` pronto pra cada plataforma
# (prebuilds/darwin-arm64/…). Recompilar não só é desnecessário como quebra:
# o node-gyp depende do Python do sistema, e o do homebrew está com o pyexpat
# corrompido. N-API é justamente a promessa de não precisar recompilar.
npmRebuild: false

# A assinatura ad-hoc fica com o electron-builder (`identity: "-"`), que assina
# de dentro pra fora — frameworks e helpers antes do bundle externo. O
# `codesign --deep` feito à mão sai na ordem errada.

# Nome fixo, sem a versão: é o que permite um link permanente do tipo
# `releases/latest/download/ravox-chat-mac.dmg` no botão de baixar. Com a
# versão no nome, o link teria que ser trocado a cada release — e alguém ia
# esquecer. A versão continua visível na página da release.
artifactName: ravox-chat-${os}.${ext}
# Os `gravae-chat-*` que também vão para a release saem do workflow, não daqui:
# são a ponte para o atualizador da v0.2.5 e anteriores, que só procura esses
# nomes (ver .github/workflows/desktop.yml).

directories:
  output: release
  buildResources: build

# `dist` é o bundle do tsup (main + preload). O `package.json` entra porque o
# Electron lê o campo `main` dele pra saber por onde começar.
#
# ⚠️ Só globs simples aqui. Misturar com entradas `from:`/`to:` faz o
# electron-builder ignorar os globs — o app saiu empacotado SEM o próprio
# código, abrindo um processo sem janela nenhuma. E aquelas entradas eram
# inúteis: ele já resolve sozinho as dependências içadas pelo yarn workspaces.
files:
  - dist/**
  - package.json

# um `.node` dentro do asar não carrega — o `require` nativo precisa de arquivo
# de verdade no disco
asarUnpack:
  - "**/node_modules/uiohook-napi/**"

mac:
  category: public.app-category.social-networking
  icon: build/icon.icns
  target:
    # `universal` empacota Intel e Apple Silicon no mesmo .dmg. Sai o dobro do
    # tamanho (~220 MB), e vale: com dois arquivos separados, quem baixa tem que
    # saber qual processador tem — e metade erra.
    - target: dmg
      arch: [universal]
  # No build universal, o electron-builder junta o app x64 com o arm64 e recusa
  # arquivos idênticos nos dois que ele não saiba resolver — foi assim que o
  # binário do uiohook-napi derrubou o primeiro build. Este padrão diz "pode
  # copiar direto, é o mesmo arquivo de propósito".
  x64ArchFiles: "**/node_modules/uiohook-napi/prebuilds/**"

  # Sem conta de desenvolvedor Apple: assinatura ad-hoc. Dá ao app uma
  # identidade estável, que é do que o TCC precisa pra guardar a permissão.
  identity: "-"
  hardenedRuntime: false
  # Sem estes textos o macOS NEGA o pedido sem mostrar nada — a permissão nem
  # chega a ser perguntada.
  extendInfo:
    CFBundleDisplayName: Ravox Chat
    NSMicrophoneUsageDescription: O Ravox Chat usa o microfone nas chamadas de voz.
    NSCameraUsageDescription: O Ravox Chat usa a câmera quando você liga o vídeo na chamada.
    NSAudioCaptureUsageDescription: O Ravox Chat captura o som do sistema ao compartilhar a tela.

# Windows precisa ser empacotado NUM Windows — daí o GitHub Actions. O .ico é
# gerado a partir do build/icon.png (512px), então não há um arquivo a manter.
#
# Sem certificado de assinatura (uns US$ 200/ano), o SmartScreen mostra um aviso
# na primeira execução, do mesmo jeito que o Gatekeeper faz no macOS. O app
# funciona normalmente.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # O executável e o atalho levam o nome bonito; só o caminho é que evita acento.
  shortcutName: Ravox Chat

# o retorno do login com Google chega por aqui
protocols:
  - name: Ravox Chat
    schemes: [gravae]

dmg:
  title: Ravox Chat
